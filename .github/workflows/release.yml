name: Release

# Runs when a tag is pushed. Tags are created by hand (`git tag -s vX.Y.Z`) so that they carry a
# signature and so the version -- including pre-releases like v0.3.0-alpha.1 -- is chosen by a
# person. The tag must match the version in pyproject.toml.
#
# workflow_dispatch builds the artifacts without releasing anything, to test this file.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      # A tag that disagrees with pyproject.toml would publish a wheel under the wrong version.
      # Compared as versions, not as text, so v0.3.0-alpha.1 and 0.3.0a1 count as the same.
      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          uv run --no-project --with packaging python - "$GITHUB_REF_NAME" "$(uv version --short)" <<'PY'
          import sys
          from packaging.version import InvalidVersion, Version
          tag, project = sys.argv[1].removeprefix("v"), sys.argv[2]
          try:
              ok = Version(tag) == Version(project)
          except InvalidVersion:
              ok = False
          if not ok:
              sys.exit(f"tag {sys.argv[1]} does not match the version in pyproject.toml ({project})")
          print(f"tag {sys.argv[1]} matches {project}")
          PY
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      # Only the base dependencies: the lyrics extra (torch, whisperX) would add several GB, and
      # needs a GPU to be useful. Those users install from PyPI instead.
      - name: Install
        shell: bash
        run: |
          uv venv
          uv pip install . pyinstaller
      - name: Build
        shell: bash
        run: >
          $(ls -d .venv/Scripts .venv/bin 2>/dev/null | head -1)/pyinstaller
          --noconfirm --clean --name madgen
          --collect-binaries imageio_ffmpeg --collect-binaries soundfile
          --collect-submodules madgen
          --exclude-module torch --exclude-module transformers
          --exclude-module matplotlib --exclude-module tkinter
          packaging/entry.py
      - name: Smoke test
        run: dist/madgen/madgen.exe --help
      # The bundled ffmpeg is GPLv3: record exactly which build it is, next to the licence text.
      - name: Record the bundled ffmpeg build
        shell: bash
        run: |
          exe=$(find dist/madgen/_internal/imageio_ffmpeg -name 'ffmpeg*.exe' | head -1)
          { "$exe" -hide_banner -version; echo; "$exe" -hide_banner -buildconf; } > dist/madgen/FFMPEG-BUILD.txt
          cp -r THIRD_PARTY_LICENSES dist/madgen/
          cp LICENSE README.md dist/madgen/
      - name: Zip
        shell: bash
        run: |
          # A branch name may contain "/", which cannot be part of a file name.
          name="madgen-${GITHUB_REF_NAME//\//-}-windows-x64"
          cd dist && mv madgen "$name"
          7z a -tzip "../$name.zip" "$name" >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: madgen-*-windows-x64.zip

  linux:
    # Built on the oldest supported runner: a binary built against a newer glibc will not start on
    # older distributions, but one built here runs on anything with glibc 2.35 or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      # Only the base dependencies, as for Windows: the lyrics extra needs a GPU to be useful.
      - name: Install
        run: |
          uv venv
          uv pip install . pyinstaller
      - name: Build
        run: >
          .venv/bin/pyinstaller --noconfirm --clean --name madgen
          --collect-binaries imageio_ffmpeg --collect-binaries soundfile
          --collect-submodules madgen
          --exclude-module torch --exclude-module transformers
          --exclude-module matplotlib --exclude-module tkinter
          packaging/entry.py
      - name: Smoke test
        run: dist/madgen/madgen --help
      - name: Record the bundled ffmpeg build
        run: |
          exe=$(find dist/madgen/_internal/imageio_ffmpeg -name 'ffmpeg*' -type f | head -1)
          { "$exe" -hide_banner -version; echo; "$exe" -hide_banner -buildconf; } > dist/madgen/FFMPEG-BUILD.txt
          cp -r THIRD_PARTY_LICENSES dist/madgen/
          cp LICENSE README.md dist/madgen/
      - name: Pack
        run: |
          name="madgen-${GITHUB_REF_NAME//\//-}-linux-x64"
          mv dist/madgen "dist/$name"
          tar -czf "$name.tar.gz" -C dist "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: madgen-*-linux-x64.tar.gz

  github-release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{windows,linux}"
          merge-multiple: true
      - name: Create the release with the builds attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version like v0.3.0-alpha.1 is marked as a pre-release on GitHub.
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          # --verify-tag refuses to invent a tag: the signed tag must already exist.
          gh release create "$GITHUB_REF_NAME" madgen-*-windows-x64.zip madgen-*-linux-x64.tar.gz \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $pre \
            || gh release upload "$GITHUB_REF_NAME" madgen-*-windows-x64.zip madgen-*-linux-x64.tar.gz \
              --repo "$GITHUB_REPOSITORY" --clobber

  changelog:
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tag itself does not carry the entry: the notes are written from the commits that the
      # tag points at, so CHANGELOG.md is updated on main right afterwards.
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Write the release notes into CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          date=$(date -u +%Y-%m-%d)
          {
            echo "# 変更履歴"
            echo
            echo "## [$GITHUB_REF_NAME](https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME) ($date)"
            echo
            echo "$notes"
            if [ -f CHANGELOG.md ]; then
              echo
              tail -n +2 CHANGELOG.md
            fi
          } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet CHANGELOG.md || { git commit -m "docs: $GITHUB_REF_NAME の変更履歴" CHANGELOG.md && git push; }

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI trusts this workflow, so no API token is stored in the repository.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
