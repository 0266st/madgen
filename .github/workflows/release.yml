name: Release

# release-please watches main: it keeps a "release PR" up to date from the commit messages
# (feat: / fix: / feat!: ...). Merging that PR creates the tag and the GitHub release, and the
# jobs below then build the artifacts and publish to PyPI.
#
# Everything lives in one workflow on purpose: a tag created by CI does not start another
# workflow run (GitHub prevents that loop), so a separate tag-triggered workflow would never fire.
#
# workflow_dispatch builds the artifacts without releasing anything, to test this file.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  windows:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      # Only the base dependencies: the lyrics extra (torch, whisperX) would add several GB, and
      # needs a GPU to be useful. Those users install from PyPI instead.
      - name: Install
        shell: bash
        run: |
          uv venv
          uv pip install . pyinstaller
      - name: Build
        shell: bash
        run: >
          $(ls -d .venv/Scripts .venv/bin 2>/dev/null | head -1)/pyinstaller
          --noconfirm --clean --name madgen
          --collect-binaries imageio_ffmpeg --collect-binaries soundfile
          --collect-submodules madgen
          --exclude-module torch --exclude-module transformers
          --exclude-module matplotlib --exclude-module tkinter
          packaging/entry.py
      - name: Smoke test
        run: dist/madgen/madgen.exe --help
      # The bundled ffmpeg is GPLv3: record exactly which build it is, next to the licence text.
      - name: Record the bundled ffmpeg build
        shell: bash
        run: |
          exe=$(find dist/madgen/_internal/imageio_ffmpeg -name 'ffmpeg*.exe' | head -1)
          { "$exe" -hide_banner -version; echo; "$exe" -hide_banner -buildconf; } > dist/madgen/FFMPEG-BUILD.txt
          cp -r THIRD_PARTY_LICENSES dist/madgen/
          cp LICENSE README.md dist/madgen/
      - name: Zip
        shell: bash
        run: |
          # A branch name may contain "/", which cannot be part of a file name.
          name="madgen-${GITHUB_REF_NAME//\//-}-windows-x64"
          cd dist && mv madgen "$name"
          7z a -tzip "../$name.zip" "$name" >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: madgen-*-windows-x64.zip

  linux:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch') }}
    # Built on the oldest supported runner: a binary built against a newer glibc will not start on
    # older distributions, but one built here runs on anything with glibc 2.35 or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      # Only the base dependencies, as for Windows: the lyrics extra needs a GPU to be useful.
      - name: Install
        run: |
          uv venv
          uv pip install . pyinstaller
      - name: Build
        run: >
          .venv/bin/pyinstaller --noconfirm --clean --name madgen
          --collect-binaries imageio_ffmpeg --collect-binaries soundfile
          --collect-submodules madgen
          --exclude-module torch --exclude-module transformers
          --exclude-module matplotlib --exclude-module tkinter
          packaging/entry.py
      - name: Smoke test
        run: dist/madgen/madgen --help
      - name: Record the bundled ffmpeg build
        run: |
          exe=$(find dist/madgen/_internal/imageio_ffmpeg -name 'ffmpeg*' -type f | head -1)
          { "$exe" -hide_banner -version; echo; "$exe" -hide_banner -buildconf; } > dist/madgen/FFMPEG-BUILD.txt
          cp -r THIRD_PARTY_LICENSES dist/madgen/
          cp LICENSE README.md dist/madgen/
      - name: Pack
        run: |
          name="madgen-${GITHUB_REF_NAME//\//-}-linux-x64"
          mv dist/madgen "dist/$name"
          tar -czf "$name.tar.gz" -C dist "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: madgen-*-linux-x64.tar.gz

  attach:
    needs: [release-please, windows, linux]
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{windows,linux}"
          merge-multiple: true
      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          # release-please already created the release; only the binaries are missing.
          for f in madgen-*-windows-x64.zip madgen-*-linux-x64.tar.gz; do
            mv "$f" "$(echo "$f" | sed "s/madgen-main-/madgen-$TAG-/")"
          done
          gh release upload "$TAG" madgen-*-windows-x64.zip madgen-*-linux-x64.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber

  pypi:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI trusts this workflow, so no API token is stored in the repository.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
