name: Release

# Runs when a tag is pushed. Tags are created by hand (`git tag -s vX.Y.Z`) so that they carry a
# signature; version numbers and CHANGELOG.md come from the release PR that release-please keeps
# up to date (see release-please.yml).
#
# workflow_dispatch builds the artifacts without releasing anything, to test this file.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      # Only the base dependencies: the lyrics extra (torch, whisperX) would add several GB, and
      # needs a GPU to be useful. Those users install from PyPI instead.
      - name: Install
        shell: bash
        run: |
          uv venv
          uv pip install . pyinstaller
      - name: Build
        shell: bash
        run: >
          $(ls -d .venv/Scripts .venv/bin 2>/dev/null | head -1)/pyinstaller
          --noconfirm --clean --name madgen
          --collect-binaries imageio_ffmpeg --collect-binaries soundfile
          --collect-submodules madgen
          --exclude-module torch --exclude-module transformers
          --exclude-module matplotlib --exclude-module tkinter
          packaging/entry.py
      - name: Smoke test
        run: dist/madgen/madgen.exe --help
      # The bundled ffmpeg is GPLv3: record exactly which build it is, next to the licence text.
      - name: Record the bundled ffmpeg build
        shell: bash
        run: |
          exe=$(find dist/madgen/_internal/imageio_ffmpeg -name 'ffmpeg*.exe' | head -1)
          { "$exe" -hide_banner -version; echo; "$exe" -hide_banner -buildconf; } > dist/madgen/FFMPEG-BUILD.txt
          cp -r THIRD_PARTY_LICENSES dist/madgen/
          cp LICENSE README.md dist/madgen/
      - name: Zip
        shell: bash
        run: |
          # A branch name may contain "/", which cannot be part of a file name.
          name="madgen-${GITHUB_REF_NAME//\//-}-windows-x64"
          cd dist && mv madgen "$name"
          7z a -tzip "../$name.zip" "$name" >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: madgen-*-windows-x64.zip

  linux:
    # Built on the oldest supported runner: a binary built against a newer glibc will not start on
    # older distributions, but one built here runs on anything with glibc 2.35 or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      # Only the base dependencies, as for Windows: the lyrics extra needs a GPU to be useful.
      - name: Install
        run: |
          uv venv
          uv pip install . pyinstaller
      - name: Build
        run: >
          .venv/bin/pyinstaller --noconfirm --clean --name madgen
          --collect-binaries imageio_ffmpeg --collect-binaries soundfile
          --collect-submodules madgen
          --exclude-module torch --exclude-module transformers
          --exclude-module matplotlib --exclude-module tkinter
          packaging/entry.py
      - name: Smoke test
        run: dist/madgen/madgen --help
      - name: Record the bundled ffmpeg build
        run: |
          exe=$(find dist/madgen/_internal/imageio_ffmpeg -name 'ffmpeg*' -type f | head -1)
          { "$exe" -hide_banner -version; echo; "$exe" -hide_banner -buildconf; } > dist/madgen/FFMPEG-BUILD.txt
          cp -r THIRD_PARTY_LICENSES dist/madgen/
          cp LICENSE README.md dist/madgen/
      - name: Pack
        run: |
          name="madgen-${GITHUB_REF_NAME//\//-}-linux-x64"
          mv dist/madgen "dist/$name"
          tar -czf "$name.tar.gz" -C dist "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: madgen-*-linux-x64.tar.gz

  github-release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{windows,linux}"
          merge-multiple: true
      - name: Create the release with the builds attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --verify-tag refuses to invent a tag: the signed tag must already exist.
          gh release create "$GITHUB_REF_NAME" madgen-*-windows-x64.zip madgen-*-linux-x64.tar.gz \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" madgen-*-windows-x64.zip madgen-*-linux-x64.tar.gz \
              --repo "$GITHUB_REPOSITORY" --clobber

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI trusts this workflow, so no API token is stored in the repository.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
