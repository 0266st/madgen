name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check that the tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv version --short)
          tag=${GITHUB_REF_NAME#v}
          test "$version" = "$tag" || { echo "tag $tag != version $version"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI trusts this workflow, so no API token is stored in the repository.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
