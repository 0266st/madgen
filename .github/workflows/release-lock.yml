name: Release PR lockfile

# release-please bumps the version in pyproject.toml, but uv.lock records it too. Without this the
# release PR would fail CI ("uv sync --locked": the lockfile no longer matches the project).
on:
  pull_request:
    branches: [main]

jobs:
  lock:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv lock
      - name: Commit the updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet uv.lock || { git commit -m "chore: update uv.lock" uv.lock && git push; }
