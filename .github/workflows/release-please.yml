name: Release PR

# Keeps a "release PR" up to date from the commit messages (feat: / fix: / feat!: ...): it bumps
# the version and writes CHANGELOG.md. Merging it does NOT release anything -- the tag is pushed
# by hand so that it carries a signature, and that tag is what starts release.yml.
on:
  push:
    branches: [main]

jobs:
  release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
