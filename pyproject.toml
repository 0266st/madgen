[project]
name = "madgen"
version = "0.1.1"
description = "音MAD auto generator: rebuilds a MIDI melody or a UST/USTX song from pieces of source audio/video"
readme = "README.md"
license = "MIT"
authors = [
    { name = "0266st", email = "main@ztssst.dev" }
]
requires-python = ">=3.12"
keywords = ["otomad", "音MAD", "unit-selection", "midi", "ust", "ustx", "audio", "video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Japanese",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "mido>=1.3.3",
    "numpy>=2.5.3",
    "pyworld==0.3.5",
    "pyyaml>=6.0.3",
    "setuptools<81",
    "soundfile>=0.14.0",
]

[project.urls]
Homepage = "https://github.com/0266st/madgen"
Repository = "https://github.com/0266st/madgen"
Issues = "https://github.com/0266st/madgen/issues"

[project.scripts]
madgen = "madgen:main"

[project.optional-dependencies]
lyrics = [
    "pyopenjtalk-plus>=0.4.1.post9",
    "whisperx>=3.8.6",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
