[project]
name = "madgen"
version = "0.1.0"
description = "音MAD auto generator: rebuilds a MIDI melody or a UST/USTX song from pieces of source audio/video"
readme = "README.md"
license = "MIT"
authors = [
    { name = "0266st", email = "main@ztssst.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "mido>=1.3.3",
    "numpy>=2.5.3",
    "pyworld>=0.3.5",
    "pyyaml>=6.0.3",
    "setuptools<81",
    "soundfile>=0.14.0",
]

[project.scripts]
madgen = "madgen:main"

[project.optional-dependencies]
lyrics = [
    "pyopenjtalk-plus>=0.4.1.post9",
    "whisperx>=3.8.6",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
